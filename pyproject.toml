[project]
name = "food-allergy-tracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Moaz Abdelaziz", email = "moathabdelaziz@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.3",
    "pydantic-settings>=2.16.2",
]

[project.scripts]
start-dev = "food_allergy_tracker.main:main"

[tool.fastapi]
entrypoint = "food_allergy_tracker.main:app"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
